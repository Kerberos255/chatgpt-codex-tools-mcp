name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Smoke-test HTTP server
        shell: bash
        run: |
          CTM_ALLOWED_ROOTS="$PWD" node dist/server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3333/healthz; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

  windows:
    name: Windows scripts and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors in $($_.FullName): $($errors | Out-String)"
            }
          }

      - name: Build release package (dry run)
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Tag "v0.0.0-ci" -OutputDir "$env:RUNNER_TEMP\release-smoke"
