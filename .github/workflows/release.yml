name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate tag, package version, and main ancestry
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use semantic version format such as v0.4.8."
          }
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The tagged commit is not contained in origin/main."
          }

      - run: npm ci
      - run: npm run check

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors in $($_.FullName): $($errors | Out-String)"
            }
          }

      - name: Build release assets
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Tag $env:GITHUB_REF_NAME -OutputDir "release-dist"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release-dist/*
          if-no-files-found: error

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: release-dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-dist/* \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
